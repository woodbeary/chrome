<!DOCTYPE html>
<html>
<head>
  <title>Tweet Generator</title>
  <style>
    body {
      width: 300px;
      padding: 10px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .api-key-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .status {
      padding: 8px;
      border-radius: 4px;
      margin-top: 10px;
      display: none;
    }
    .status.success {
      background-color: #e6ffe6;
      color: #006700;
      display: block;
    }
    .status.error {
      background-color: #ffe6e6;
      color: #670000;
      display: block;
    }
    .key-status {
      font-size: 0.9em;
      color: #666;
      margin-top: 5px;
    }
    button {
      background-color: #1da1f2;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background-color: #1991da;
    }
    .button-row {
      display: flex;
      gap: 10px;
    }
    #testKey {
      background-color: #4CAF50;
    }
    #testKey:hover {
      background-color: #45a049;
    }
    #testKey:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
    #testResults {
      background-color: #f5f5f5;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 8px;
      margin-top: 10px;
      font-size: 0.9em;
      max-height: 150px;
      overflow-y: auto;
      display: none;
    }
    pre {
      margin: 0;
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 0.8em;
    }
  </style>
</head>
<body>
  <div class="api-key-form">
    <h3>Gemini API Settings</h3>
    <div class="key-status" id="keyStatus">No API key saved</div>
    <input type="password" id="apiKey" placeholder="Enter your Gemini API key">
    <div class="button-row">
      <button id="saveKey">Save API Key</button>
      <button id="clearKey" style="background-color: #dc3545; display: none;">Clear API Key</button>
    </div>
    <button id="testKey" style="margin-top: 10px; display: none;">Test API Connection</button>
    <div id="testResults">
      <div>Test results will appear here...</div>
      <pre id="testOutput"></pre>
    </div>
    <div id="status" class="status"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
